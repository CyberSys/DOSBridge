# DOS Bridge network configuration.
#
# Read by UGET, UPUT and NTP before %MTCPCFG%, so this machine does
# not need mTCP installed. Same key names as an mTCP config, so an
# existing mtcp.cfg can simply be copied over this file.
#
# The installer puts this at C:\AI\NET.CFG.
#
IPADDR 192.168.1.20
NETMASK 255.255.255.0
GATEWAY 192.168.1.1
